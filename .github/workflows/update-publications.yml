name: Update publications

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday, 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest publications from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_publications.py

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/js/publications.js; then
            echo "No new publications."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/js/publications.js
          git commit -m "Update publications from Google Scholar"
          git push
